
name: Python CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flake8 nose

      - name: Lint
        run: |
          flake8 .

      
      - name: Unit tests
        run: |
          python -c "import collections, collections.abc; collections.Callable = collections.abc.Callable; import nose; nose.main()"

