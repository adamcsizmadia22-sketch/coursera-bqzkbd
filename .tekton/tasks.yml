
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: python:3.11
      script: |
        #!/bin/sh
        echo "Cleaning workspace..."
        find . -name "__pycache__" -type d -exec rm -rf {} +
        find . -name "*.pyc" -delete

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test
spec:
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        pip install nose
        nosetests
